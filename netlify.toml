[build]
command = "pnpm build"
publish = "dist"

[build.environment]
NODE_VERSION = "24.18.1"
PNPM_VERSION = "11.21.0"
NODE_ENV = "production"

[[headers]]
for = "/*"
  [headers.values]
  Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-src https://www.youtube-nocookie.com; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "DENY"

[[headers]]
for = "/_astro/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/pagefind/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"
